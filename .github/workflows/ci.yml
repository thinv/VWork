name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @vwork/contracts typecheck
      - run: pnpm --filter @vwork/core-api typecheck
      - run: pnpm --filter @vwork/web typecheck
      - run: pnpm --filter @vwork/mobile typecheck
      - run: pnpm --package=@redocly/cli@2 dlx redocly lint docs/06-api/openapi/vwork-openapi.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./services/ai-orchestrator[dev]"
      - run: ruff check services/ai-orchestrator
      - run: pytest services/ai-orchestrator
