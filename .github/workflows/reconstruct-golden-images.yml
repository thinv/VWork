name: Reconstruct Golden Images

on:
  push:
    paths:
      - 'docs/04-design/golden-images/_chunks/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct image binaries
        run: bash scripts/reconstruct-golden-images.sh
      - name: Commit generated Golden Images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/04-design/golden-images/*.webp
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "docs(design): reconstruct golden image pack batch 01"
          git push
