name: Reconstruct Marketing Assets

on:
  push:
    paths:
      - 'apps/web/public/_asset-chunks/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct website assets
        run: bash scripts/reconstruct-marketing-assets.sh
      - name: Commit generated website assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/web/public/golden/marketing/*.webp             apps/web/public/brand/vwork/*.webp             apps/web/public/brand/trolycongchuc/*.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "assets(web): add approved Golden Images and brand logos"
          git push
