components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
        details:
          type: array
          items: { type: object, additionalProperties: true }
    AsyncJobRef:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string }
        statusUrl: { type: string }
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Created:
      description: Created
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    AsyncAccepted:
      description: Long-running operation accepted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AsyncJobRef' }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict or stale version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: Business validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
